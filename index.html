
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ディグダたたき</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>⛏️ ディグダたたき！</h1>
    <p class="subtitle">出てきたディグダをタップしよう！</p>

    <div class="status">
      <div>
        スコア
        <strong id="score">0</strong>
      </div>
      <div>
        のこり時間
        <strong><span id="time">30</span>秒</strong>
      </div>
    </div>

    <div id="board" class="board"></div>

    <button id="startButton" class="start">
      ゲームスタート！
    </button>

    <p id="message" class="message">
      ディグダをたくさん叩こう！
    </p>
  </main>

  <script src="script.js"></script>
</body>
</html>
